name: Validar bóveda
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar notas
        run: python3 scripts/validar.py
      - name: Comprobar que indice.json está actualizado
        run: |
          python3 scripts/indexar.py
          git diff --exit-code indice.json || (echo "Ejecuta python3 scripts/indexar.py y sube indice.json" && exit 1)
      - name: Pruebas de consulta
        run: cd scripts && python3 test_consultas.py
